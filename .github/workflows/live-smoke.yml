name: Live API Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    # Never execute code from an untrusted fork on the owner's home laptop.
    if: >-
      github.actor == 'glutoide' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [personal-sensorfact]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Run live Blockchain.com integration smoke
        env:
          RUN_LIVE_SMOKE: '1'
        run: npm test -- tests/live-smoke.test.ts --runInBand
