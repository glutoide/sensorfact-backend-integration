name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    if: ${{ false }} # GitHub-hosted spending disabled pending self-hosted port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npm run audit:prod
