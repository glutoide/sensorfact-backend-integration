name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Never execute code from an untrusted fork on the owner's home laptop.
    if: >-
      github.actor == 'glutoide' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [personal-sensorfact]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: npm run audit:prod
